version: '3.9'

services:
  # ─── MySQL 8.0 Database ───────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: dayflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2026
      MYSQL_DATABASE: dayflow_hrms
      MYSQL_USER: dayflow_user
      MYSQL_PASSWORD: dayflow_password
    ports:
      - "3307:3306"      # Host port 3307 → Container 3306 (avoids clash with local MySQL)
    volumes:
      - dayflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dayflow_user", "-pdayflow_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Node.js / Express Backend ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dayflow_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: mysql://dayflow_user:dayflow_password@db:3306/dayflow_hrms
      JWT_SECRET: super_secure_jwt_secret_dayflow_2026_odoo
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "http://localhost:3000,http://localhost:5173"
    ports:
      - "5000:5000"
    volumes:
      - .:/app                     # Hot-reload: mount source directory
      - /app/node_modules          # Preserve container's node_modules
    command: npm run dev

volumes:
  dayflow_mysql_data:
    driver: local
